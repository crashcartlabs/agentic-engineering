name: Weekly Janitor Report

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    name: Report-only maintenance scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Generate weekly janitor report
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          # Optional repo-specific callouts; leave unset to disable.
          # AGENTIC_JANITOR_TARGET_ISSUE: "65"
          # AGENTIC_JANITOR_DASHBOARD_PRS: "81,83,84"
        run: |
          mkdir -p "$RUNNER_TEMP/janitor"
          python3 scripts/maintenance/weekly_janitor_report.py \
            --fetch \
            --branch-scope remote \
            --output "$RUNNER_TEMP/janitor/weekly-janitor-report.md"
          cat "$RUNNER_TEMP/janitor/weekly-janitor-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-janitor-report
          path: ${{ runner.temp }}/janitor/weekly-janitor-report.md
